[package]
name = "openkeyboard-probe"
version = "0.1.0"
description = "Collects what OpenKeyboard needs to know about a keyboard without sending commands to it"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "openkeyboard_probe"

[[bin]]
name = "openkeyboard-probe"
path = "src/main.rs"

[dependencies]
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Console",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
