[package]
name = "openkeyboard-desktop"
version = "0.1.0"
description = "OpenKeyboard as a desktop app with native HID access"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "openkeyboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
